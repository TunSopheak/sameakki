# Render Blueprint: one web service. The database lives on Neon (or any PostgreSQL),
# so paste its connection string as DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: leadersync
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
